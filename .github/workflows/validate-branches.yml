name: Validate branch naming and source

on:
  pull_request:
    branches: [develop, master]

jobs:
  validate_branch:
    name: Validate branch naming and source
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and origin
        env:
          TARGET: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
        run: |
          echo "Source: $SOURCE -> Target: $TARGET"

          # master only receives PRs from develop, hotfix/* or Dependabot security updates
          if [[ "$TARGET" == "master" && ! "$SOURCE" =~ ^(develop|hotfix/[a-z0-9._-]+|dependabot/.+)$ ]]; then
            echo "::error::PRs to master are only allowed from develop, hotfix/* or dependabot/*"
            exit 1
          fi

          # develop only receives PRs from feature/* or hotfix/*
          if [[ "$TARGET" == "develop" && ! "$SOURCE" =~ ^((feature|hotfix)/[a-z0-9._-]+|dependabot/.+)$ ]]; then
            echo "::error::PRs to develop are only allowed from feature/*, hotfix/* or dependabot/*"
            exit 1
          fi
