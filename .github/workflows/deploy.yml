name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-1a2b3c4). Empty = build and deploy the current commit."
        required: false
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/jump0ts/travel_agency
  DOMAIN: travel.josanfersal.dev

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.image_tag == ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint
      - run: npm run type-check

  build:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.image_tag == ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build-push
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://${{ env.DOMAIN }}
            APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: false

  deploy:
    name: Deploy to production
    needs: build
    if: >-
      always() &&
      (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://travel.josanfersal.dev
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate image tag
        run: |
          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::Invalid image tag: $TAG"
            exit 1
          fi

      - name: Resolve digest and verify build provenance
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_REPO:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a valid digest for $TAG"
            exit 1
          fi
          gh attestation verify "oci://$IMAGE_REPO@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        run: rsync -az -e "ssh -i $HOME/.ssh/deploy_key" deploy/ "$TARGET:/opt/travel-agency/"

      - name: Log the server into GHCR (short-lived token)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "cd /opt/travel-agency && DOMAIN='$DOMAIN' IMAGE_REPO='$IMAGE_REPO' IMAGE_DIGEST='$IMAGE_DIGEST' ./deploy.sh '$TAG'"

      - name: Log the server out of GHCR
        if: always()
        run: ssh -i ~/.ssh/deploy_key "$TARGET" "docker logout ghcr.io" || true

      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            "https://$DOMAIN/api/health" | tee /dev/stderr | grep -q '"status":"ok"'

  cleanup:
    name: Prune old images in GHCR
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: travel_agency
          package-type: container
          min-versions-to-keep: 5
