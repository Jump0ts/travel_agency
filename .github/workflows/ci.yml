name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint
      - run: npm run type-check

  docker-build:
    name: Docker build (no push)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: travel-agency:ci
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://travel.josanfersal.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker image ls travel-agency:ci --format 'Image size: {{.Size}}'
          docker run -d --name app -p 3000:3000 travel-agency:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then
              echo " -> container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy:"
          docker logs app
          exit 1
