name: travel-agency

services:
  app_blue:
    image: ${BLUE_IMAGE:-none}
    restart: unless-stopped
    mem_limit: 400m

  app_green:
    image: ${GREEN_IMAGE:-none}
    restart: unless-stopped
    mem_limit: 400m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Reload every 6h so renewed certificates are picked up.
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Try to renew twice a day; certbot only renews when <30 days remain.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done'

volumes:
  certbot-www:
  letsencrypt:
